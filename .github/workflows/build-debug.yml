name: Eta Build Debug

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-signed-release:
    name: 构建 Debug 签名 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@v2
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 构建 Release APK（使用 Debug 签名）
        env:
          ETA_DISABLE_RELEASE_SIGNING: "true"
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleRelease

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: eta-debug-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
